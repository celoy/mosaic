# Parameters for the pygame viewer (toy/viewer.py) and PNG snapshots (tools/science.py).

[window]
width = 1280
height = 820
grid_width = 800          # width of the grid area (left column, full window height)
fps = 60

[speed]
base_time_per_s = 1.0     # x1 = this many sim time units per wall second
multipliers = [1, 4, 16]
frame_budget_ms = 30.0    # max simulation time per frame (x16 may fall behind)
chunk_attempts = 2048     # attempts between chart samples (partial sweeps)

[lamps]
tau = 1.0                 # smoothing time of the firing rate (sim time units)
half = 0.02               # firing rate per cell per unit time at which a lamp is half lit

[chart]
window = 60.0             # sim time units shown
height = 220

[grid]
border = 0.0              # dark gap between hexes, fraction of the inradius (0 = none)

[palette]
default = "chris"         # one of the [palettes] below; switch live from the viewer menu
show_glyphs = false       # symbols on the equation blocks (toggle in the viewer)
glyphs = ["circle", "triangle", "square", "diamond", "cross", "ring", "bar", "x"]
background = "#1E1E24"

[palettes]
# Lists of hex colours. Levels with more colours than listed get extra pastel hues.
# "greyscale" is generated for any number of colours.
chris = ["#CBE896", "#AAC0AA", "#FCDFA6", "#A18276", "#F4B886"]   # coolors.co, 2026-11-18
okabe_ito = ["#E69F00", "#56B4E9", "#009E73", "#F0E442", "#0072B2", "#D55E00", "#CC79A7", "#999999"]
tol_bright = ["#4477AA", "#EE6677", "#228833", "#CCBB44", "#66CCEE", "#AA3377", "#BBBBBB"]
greyscale = []
